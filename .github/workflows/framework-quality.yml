name: Framework-kontroll

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Bygg programfilen
        run: node build.mjs
      - name: Kontroller at genererte filer er oppdatert
        run: git diff --exit-code -- Korpsbrev.html version.json
      - name: Kontroller versjon og JavaScript
        run: |
          node -e "const v=require('./version.json').version;if(!/^\\d+\\.\\d+\\.\\d+$/.test(v))process.exit(1)"
          node --check build.mjs
          node --check src/pdf-engine.js
          node --check src/updater.js
